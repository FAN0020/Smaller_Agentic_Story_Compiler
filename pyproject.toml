[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storycompiler"
version = "0.1.0"
description = "A local, director-led story-to-episode production studio"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "python-multipart>=0.0.18", "cryptography>=43", "pillow>=11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "httpx2"]
local = ["torch>=2.6", "diffusers>=0.35,<1", "transformers>=4.45,<5", "accelerate>=1", "sentencepiece>=0.2", "imageio[ffmpeg]>=2.35", "safetensors>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["backend/storycompiler"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
